encoding: utf-8
lang: en
locale: en_US
timezone: UTC

title: Pirate Chain Timeline
keywords: cryptocurrency, privacy, pirate chain, arrr, fungible
description: >-
  See what has already been accomplished and what's planned for the future
  for the open source Pirate Chain community.

# Production GitHub Pages address. For a preview at localhost:4000,
# run bundle exec jekyll serve --livereload --baseurl "".
url: "https://s-ftf.github.io"
baseurl: "/pirate-timeline"
repo: "https://github.com/s-ftf/pirate-timeline"
featured: "/assets/img/site/featured-image.png"
featured_width: 1200
featured_height: 632
featured_type: image/png

strict_front_matter: true

collections:
  milestones:
    output: true

defaults:
  - scope:
      path: ""
      type: milestones
    values:
      layout: milestone

# These are repository/development files, not published site content.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - .bundle
  - .github
  - scripts
