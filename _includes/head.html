<head>
  <meta charset="utf-8" />
  <title>{% if page.title %}{{ page.title | escape }} | {% endif %}{{ site.title | escape }}</title>
  <meta name="keywords" content="{{ site.keywords | escape }}" />
  <meta name="description" content="{{ site.description | strip | escape }}" />
  <meta name="author" content="Pirate Chain" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#151326" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph -->
  <meta property="og:locale" content="{{ site.locale | escape }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.title | escape }}" />
  <meta property="og:description" content="{{ site.description | strip | escape }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="{{ site.title | escape }}" />
  <meta property="og:image" content="{{ site.featured | absolute_url }}" />
  <meta property="og:image:width" content="{{ site.featured_width }}" />
  <meta property="og:image:height" content="{{ site.featured_height }}" />
  <meta property="og:image:type" content="{{ site.featured_type | escape }}" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@PirateChain" />
  <meta name="twitter:description" content="{{ site.description | strip | escape }}" />
  <meta name="twitter:title" content="{{ page.title | default: site.title | escape }}" />
  <meta name="twitter:image" content="{{ site.featured | absolute_url }}" />

  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <link rel="icon" href="{{ '/assets/img/site/Pirate_Logo_Coin_Gold.svg' | relative_url }}" sizes="any" type="image/svg+xml" />
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}?v={{ site.time | date: '%s' }}" />
  <script defer src="{{ '/assets/js/site.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
</head>
