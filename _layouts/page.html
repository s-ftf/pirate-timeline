<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {% include head.html %}
  <body>
    {{ content }}
    {% include footer.html %}
    <dialog id="image-viewer" class="image-viewer" aria-label="Milestone image viewer">
      <div class="image-viewer-actions">
        <a id="image-viewer-download" class="image-viewer-action" href="#" download aria-label="Download image" title="Download image">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 3v12m-5-5 5 5 5-5M5 16v5h14v-5" />
          </svg>
        </a>
        <a id="image-viewer-open" class="image-viewer-action" href="#" target="_blank" rel="noopener noreferrer" aria-label="Open image in new tab" title="Open image in new tab">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M14 3h7v7m0-7L11 13M10 3H3v18h18v-7" />
          </svg>
        </a>
        <button id="image-viewer-close" class="image-viewer-action" type="button" aria-label="Close image viewer" title="Close image viewer" autofocus>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
            <path d="m6 6 12 12M18 6 6 18" />
          </svg>
        </button>
      </div>
      <img class="image-viewer-image" alt="" />
    </dialog>
  </body>
</html>
